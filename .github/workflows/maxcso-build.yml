# Requires repo secret: PERSONAL_ACCESS_TOKEN with permissions:
#   Contents: read and write
#   Pull Requests: read and write

name: maxcso Build

on:
  workflow_dispatch:
    inputs:
      maxcso_ref:
        description: 'Git ref (refs/heads/<branch>, refs/tags/<tag>, etc.) or SHA'
        required: true
        type: string
      auto-merge:
        description: 'Auto-merge pull request?'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  MAXCSO_REF: ${{ inputs.maxcso_ref || 'v1.13.0' }}

jobs:
  build-linux:
    name: build-linux ${{ matrix.nodejs_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - docker_image: i386/ubuntu:latest
            docker_arch: linux/386
            nodejs_arch: ia32
          - docker_image: ubuntu:latest
            docker_arch: linux/amd64
            nodejs_arch: x64
          #- docker_image: ubuntu:latest
          #  docker_arch: linux/arm/v7
          #  nodejs_arch: arm
          - docker_image: ubuntu:latest
            docker_arch: linux/arm64/v8
            nodejs_arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: unknownbrackets/maxcso
          ref: ${{ env.MAXCSO_REF }}
      - name: Patch source
        run: |
          # Statically link libuv
          sed -i 's/-luv\b/-l:libuv.a -ldl -lrt/' Makefile
      - uses: docker/setup-qemu-action@v3
      - name: Build
        uses: addnab/docker-run-action@v3
        with:
          image: ${{ matrix.docker_image }}
          shell: bash
          options: |
            --platform ${{ matrix.docker_arch }}
            --volume ${{ github.workspace }}:/build
            --workdir /build
          run: |
            set -euo pipefail

            apt-get update
            apt-get install -y build-essential pkgconf zlib1g-dev liblz4-dev libuv1-dev
            make VERBOSE=1 -j$(nproc)

            apt-get install -y binutils
            ls -al maxcso
            strip maxcso
            ls -al maxcso
      - name: Test binary
        run: |
          set -x
          ./maxcso --help || true
          file maxcso
          readelf -d maxcso | grep NEEDED
      - name: Rename binary
        run: |
          dir="artifacts/packages/maxcso-linux-${{ matrix.nodejs_arch }}"
          mkdir -p "${dir}"
          mv maxcso "${dir}/"
          ls -al "${dir}/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ matrix.nodejs_arch }}-${{ github.sha }}
          path: artifacts/**/maxcso
          if-no-files-found: error

  build-macos:
    name: build-macos ${{ matrix.nodejs_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            nodejs_arch: x64
          - os: macos-15
            nodejs_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: unknownbrackets/maxcso
          ref: ${{ env.MAXCSO_REF }}
      - name: Install dependencies
        run: brew install --overwrite lz4 libuv libdeflate
      - name: Build
        run: |
          BREW_PREFIX="$(brew --prefix)"
          make VERBOSE=1 "-j$(sysctl -n hw.physicalcpu)" "CFLAGS=-O2 -I${BREW_PREFIX}/include" "CXXFLAGS=-O2 -I${BREW_PREFIX}/include -L${BREW_PREFIX}/lib" "LIBS=-luv -llz4 -lz"
      - name: Make portable
        run: |
          set -x
          otool -L maxcso | awk '{print $1}' | grep -E "^$(brew --prefix)" | while read -r file; do
            cp "${file}" ./
            install_name_tool -change "${file}" "@executable_path/$(basename "${file}")" maxcso
          done
          brew uninstall --ignore-dependencies lz4 libuv libdeflate
      - name: Test binary
        run: |
          set -x
          ./maxcso --help || true
          file maxcso
          otool -L maxcso
      - name: Strip binary
        run: |
          ls -al maxcso
          strip maxcso
          ls -al maxcso
      - name: Rename binary
        run: |
          dir="artifacts/packages/maxcso-darwin-${{ matrix.nodejs_arch }}"
          mkdir -p "${dir}"
          mv maxcso ./*.dylib "${dir}/"
          ls -al "${dir}/"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ matrix.nodejs_arch }}-${{ github.sha }}
          path: |
            artifacts/**/maxcso
            artifacts/**/*.dylib
          if-no-files-found: error

  build-windows:
    name: build-windows ${{ matrix.nodejs_arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: x64
            nodejs_arch: x64
          - os: windows-latest
            platform: Win32
            nodejs_arch: ia32
          - os: windows-11-arm
            platform: ARM64
            nodejs_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: unknownbrackets/maxcso
          ref: ${{ env.MAXCSO_REF }}
      - name: Detect VC toolset
        shell: powershell
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vsWhere)) {
            $vsWhere = "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe"
          }
          $vsPath  = & $vsWhere -latest -property installationPath
          $vcMsDir = Get-ChildItem "$vsPath\MSBuild\Microsoft\VC" -Directory | Sort-Object Name | Select-Object -Last 1
          $toolset = (Get-ChildItem "$($vcMsDir.FullName)\Platforms\x64\PlatformToolsets" -Filter "v1*" -Directory | Sort-Object Name | Select-Object -Last 1).Name
          Write-Host "Detected VC toolset: $toolset"
          "PLATFORM_TOOLSET=$toolset" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Patch source
        shell: powershell
        run: |
          foreach ($path in @(
            "cli/cli.vcxproj", "zlib/zlib.vcxproj", "zopfli/zopfli.vcxproj",
            "libuv/libuv.vcxproj", "7zip/7zip.vcxproj", "src/src.vcxproj",
            "lz4/lz4.vcxproj", "libdeflate/libdeflate.vcxproj"
          )) {
            if (-not (Test-Path $path)) { continue }
            $c = [System.IO.File]::ReadAllText($path)
            # Remove old Windows SDK version so MSBuild uses the default (latest installed)
            $new = [regex]::Replace($c, '\s*<WindowsTargetPlatformVersion>[^<]*</WindowsTargetPlatformVersion>', '')
            if ($new -ne $c) {
              [System.IO.File]::WriteAllText($path, $new)
              Write-Host "Patched: $path"
            }
          }
      - if: matrix.platform == 'ARM64'
        name: Patch source for ARM64
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # Patch maxcso.sln to add Release|ARM64 platform
          $slnPath = "cli/maxcso.sln"
          $sln = [System.IO.File]::ReadAllText($slnPath)
          $sln = $sln.Replace(
            "Release|x64 = Release|x64",
            "Release|x64 = Release|x64`r`n`t`tRelease|ARM64 = Release|ARM64"
          )
          $sln = [regex]::Replace($sln, '(\{[A-Fa-f0-9-]+\})(\.Release\|x64\.Build\.0 = Release\|x64)', {
            param($m)
            $guid = $m.Groups[1].Value
            "$($m.Value)`r`n`t`t${guid}.Release|ARM64.ActiveCfg = Release|ARM64`r`n`t`t${guid}.Release|ARM64.Build.0 = Release|ARM64"
          })
          [System.IO.File]::WriteAllText($slnPath, $sln)
          Write-Host "Patched: $slnPath"

          # Patch all .vcxproj files to add Release|ARM64 configuration
          $vcxprojPaths = @(
            "cli/cli.vcxproj", "zlib/zlib.vcxproj", "zopfli/zopfli.vcxproj",
            "libuv/libuv.vcxproj", "7zip/7zip.vcxproj", "src/src.vcxproj",
            "lz4/lz4.vcxproj", "libdeflate/libdeflate.vcxproj"
          )
          foreach ($vcxprojPath in $vcxprojPaths) {
            if (-not (Test-Path $vcxprojPath)) { Write-Warning "Skipping: $vcxprojPath"; continue }
            $c = [System.IO.File]::ReadAllText($vcxprojPath)

            # Clone Release|x64 ProjectConfiguration entry to ARM64
            $mx = [regex]::Match($c, '(?s)<ProjectConfiguration Include="Release\|x64">.*?</ProjectConfiguration>')
            if ($mx.Success) {
              $arm64 = $mx.Value -replace 'Release\|x64', 'Release|ARM64' -replace '<Platform>x64</Platform>', '<Platform>ARM64</Platform>'
              $c = $c.Replace($mx.Value, "$($mx.Value)`n    $arm64")
            }

            # Clone all Release|x64 conditional XML elements to Release|ARM64
            $opts = [System.Text.RegularExpressions.RegexOptions]::Singleline
            $pat = [System.Text.RegularExpressions.Regex]::new(
              '(<(PropertyGroup|ImportGroup|ItemDefinitionGroup)[^>]*Condition="[^"]*Release\|x64[^"]*"[^>]*>)(.*?)(</\2>)', $opts
            )
            $c = $pat.Replace($c, [System.Text.RegularExpressions.MatchEvaluator]{
              param($m)
              $openTag  = $m.Groups[1].Value -replace 'Release\|x64', 'Release|ARM64'
              $middle   = $m.Groups[3].Value
              # Remove x86-only settings not supported on ARM64
              $middle   = [regex]::Replace($middle, '\s*<EnableEnhancedInstructionSet>[^<]*</EnableEnhancedInstructionSet>', '')
              $middle   = [regex]::Replace($middle, '\s*<OmitFramePointers>[^<]*</OmitFramePointers>', '')
              $closeTag = $m.Groups[4].Value
              "$($m.Value)`n  $openTag$middle$closeTag"
            })

            [System.IO.File]::WriteAllText($vcxprojPath, $c)
            Write-Host "Patched: $vcxprojPath"
          }
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: |
          msbuild cli/maxcso.sln -maxcpucount /property:Configuration=Release "/property:Platform=${{ matrix.platform }}" "/property:PlatformToolset=${{ env.PLATFORM_TOOLSET }}"
          cmd /r dir /q
      - name: Test binary
        shell: pwsh
        run: |
          $path = Resolve-Path "maxcso*.exe"
          & $path --help || true
#      - name: Strip binary
#        run: |
#          ls -al maxcso.exe
#          strip maxcso.exe
#          ls -al maxcso.exe
      - name: Rename binary
        shell: pwsh
        run: |
          $Dir = "artifacts\packages\maxcso-win32-${{ matrix.nodejs_arch }}"
          mkdir "$Dir"
          mv maxcso*.exe "$Dir\maxcso.exe"
          cmd /r dir "$Dir\" /q
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/**/maxcso.exe
          if-no-files-found: error

  git-update:
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete old macoS .dylibs
        run: |
          rm packages/*-darwin-*/*.dylib
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: actions/setup-node@v4
      - id: bump-and-commit
        run: |
          package_name=$(jq --raw-output '.name' packages/maxcso/package.json)
          major_version=$(npm show "${package_name}" --json | jq --raw-output '.versions | .[]' | sed 's/\.[0-9]*//g' | sort | tail -1)
          # shellcheck disable=SC2001
          minor_version=$(echo "${MAXCSO_REF}" | sed 's/[^0-9]*//g' | sed 's/^0*//')
          previous_version=$(npm show "${package_name}" --json | jq --raw-output '.versions | .[]' | grep "${minor_version}" | tail -1)
          if [[ "${previous_version}" != "" ]]; then
            # shellcheck disable=SC2001
            new_patch_version=$(echo "$(echo "${previous_version}" | sed 's/[0-9]*\.//g') + 1" | bc)
            new_version="${major_version}.${minor_version}.${new_patch_version}"
          else
            new_version="${major_version}.${minor_version}.0"
          fi
          lerna version "${new_version}" --yes || true

          chmod +x packages/maxcso-*-*/maxcso*
          ls -lR
          git add package*.json lerna.json packages

          USER_EMAIL="${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          echo "USER_EMAIL=${USER_EMAIL}" >> "${GITHUB_OUTPUT}"
          git config --global user.email "${USER_EMAIL}"

          USER_NAME="$(gh api "/users/${GITHUB_ACTOR}" | jq .name -r)"
          echo "USER_NAME=${USER_NAME}" >> "${GITHUB_OUTPUT}"
          git config --global user.name "${USER_NAME}"

          PACKAGE_VERSION="$(jq --raw-output '.version' packages/maxcso/package.json)"
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
          git commit -m "v${PACKAGE_VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
      # Create the pull request, and optionally mark it as auto-merge
      - id: create-pull-request
        uses: peter-evans/create-pull-request@v6
        with:
          # GitHub won't run workflows off of events from the `github-actions` user
          # But also, I want the PR to be created under my name for cosmetic reasons
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          author: ${{ steps.bump-and-commit.outputs.USER_NAME }} <${{ steps.bump-and-commit.outputs.USER_EMAIL }}>
          branch: ${{ github.actor }}/${{ steps.bump-and-commit.outputs.PACKAGE_VERSION }}
          delete-branch: true
          title: v${{ steps.bump-and-commit.outputs.PACKAGE_VERSION }}
          assignees: ${{ !inputs.auto-merge && github.repository_owner || '' }}
          reviewers: ${{ (!inputs.auto-merge && github.repository_owner != github.actor) && github.repository_owner || '' }}
      - if: ${{ steps.create-pull-request.outputs.pull-request-number }}
        run: |
          {
            echo "# v${{ steps.bump-and-commit.outputs.PACKAGE_VERSION }}"
            echo ""
            echo "${{ steps.create-pull-request.outputs.pull-request-url }}"
          } >> "${GITHUB_STEP_SUMMARY}"
      - if: ${{ steps.create-pull-request.outputs.pull-request-number && inputs.auto-merge }}
        run: gh pr merge "${{ steps.create-pull-request.outputs.pull-request-number }}" --squash --auto
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
